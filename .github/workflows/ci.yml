name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: ghcr.io/lebedenko/holonight-settings-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout holonight-config
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: 81b01d3ae8433f3a4b017db2feb588a1ee62b714
          path: holonight-config-dep
      - name: Checkout holonight-qt
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: 50c59558bb3817f57a992dd72730dba141db1bc8
          path: holonight-qt-dep
      - name: Checkout holonight-shell
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-shell
          ref: 587c8164024986725b8a0f4b4a7fa03d3fc4c8cd
          path: holonight-shell-dep
      - name: Checkout holonight-system-services
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-system-services
          ref: 4556dc9b22237823387110340347cd1301ed9245
          path: holonight-system-services-dep
      - name: Install holonight-config
        run: |
          cmake -S holonight-config-dep -B holonight-config-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build holonight-config-dep/build --parallel
          cmake --install holonight-config-dep/build --prefix "$GITHUB_WORKSPACE/dependency-prefix"
      - name: Install holonight-qt
        run: |
          cmake -S holonight-qt-dep -B holonight-qt-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/dependency-prefix" -DBUILD_TESTS=OFF -DBUILD_DEMO=OFF -DBUILD_CONTROLS_GALLERY=OFF -DBUILD_QT5_PROBES=OFF
          cmake --build holonight-qt-dep/build --parallel
          cmake --install holonight-qt-dep/build --prefix "$GITHUB_WORKSPACE/dependency-prefix"
      - name: Install holonight-shell config
        run: |
          cmake -S holonight-shell-dep/libs/holonight-shell-config -B holonight-shell-config-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build holonight-shell-config-build --parallel
          cmake --install holonight-shell-config-build --prefix "$GITHUB_WORKSPACE/dependency-prefix"
      - name: Install holonight-system-services
        run: |
          cmake -S holonight-system-services-dep -B holonight-system-services-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build holonight-system-services-build --parallel
          cmake --install holonight-system-services-build --prefix "$GITHUB_WORKSPACE/dependency-prefix"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/dependency-prefix" -DCMAKE_INSTALL_PREFIX=/tmp/holonight-settings-prefix
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: dbus-run-session -- ctest --test-dir build --output-on-failure --no-tests=error
      - name: Import policy
        run: |
          python3 scripts/check-qml-import-policy.py
          python3 tests/test_qml_import_policy.py
      - name: QML checks
        run: |
          bash scripts/check-qmltypes.sh build
          cmake --build build --target qml-lint
      - name: Application install smoke
        run: |
          mkdir -p /tmp/holonight-settings-prefix
          cp -a "$GITHUB_WORKSPACE/dependency-prefix/." /tmp/holonight-settings-prefix/
          cmake --install build
          test -x /tmp/holonight-settings-prefix/bin/holonight-settings
          service=/tmp/holonight-settings-prefix/share/dbus-1/services/org.holonight.Settings.service
          grep -Fx 'Exec=/tmp/holonight-settings-prefix/bin/holonight-settings' "$service"
          test -x "$(sed -n 's/^Exec=//p' "$service")"
          for mode in default environment command-line configuration; do
            python3 tests/check_settings_startup.py /tmp/holonight-settings-prefix/bin/holonight-settings /tmp/holonight-settings-prefix/lib/qt6/qml "$mode" --forbid-qml-root "$GITHUB_WORKSPACE/dependency-prefix/lib/qt6/qml"
          done

  static-checks:
    runs-on: ubuntu-24.04
    container: ghcr.io/lebedenko/holonight-settings-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout holonight-config
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: 81b01d3ae8433f3a4b017db2feb588a1ee62b714
          path: holonight-config-dep
      - name: Checkout holonight-qt
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: 50c59558bb3817f57a992dd72730dba141db1bc8
          path: holonight-qt-dep
      - name: Checkout holonight-shell
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-shell
          ref: 587c8164024986725b8a0f4b4a7fa03d3fc4c8cd
          path: holonight-shell-dep
      - name: Checkout holonight-system-services
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-system-services
          ref: 4556dc9b22237823387110340347cd1301ed9245
          path: holonight-system-services-dep
      - name: Install holonight-config
        run: |
          cmake -S holonight-config-dep -B holonight-config-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build holonight-config-dep/build --parallel
          cmake --install holonight-config-dep/build --prefix "$GITHUB_WORKSPACE/dependency-prefix"
      - name: Install holonight-qt
        run: |
          cmake -S holonight-qt-dep -B holonight-qt-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/dependency-prefix" -DBUILD_TESTS=OFF -DBUILD_DEMO=OFF -DBUILD_CONTROLS_GALLERY=OFF -DBUILD_QT5_PROBES=OFF
          cmake --build holonight-qt-dep/build --parallel
          cmake --install holonight-qt-dep/build --prefix "$GITHUB_WORKSPACE/dependency-prefix"
      - name: Install holonight-shell config
        run: |
          cmake -S holonight-shell-dep/libs/holonight-shell-config -B holonight-shell-config-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build holonight-shell-config-build --parallel
          cmake --install holonight-shell-config-build --prefix "$GITHUB_WORKSPACE/dependency-prefix"
      - name: Install holonight-system-services
        run: |
          cmake -S holonight-system-services-dep -B holonight-system-services-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build holonight-system-services-build --parallel
          cmake --install holonight-system-services-build --prefix "$GITHUB_WORKSPACE/dependency-prefix"
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/dependency-prefix"
      - run: cmake --build build --target format-check
      - run: cmake --build build --target tidy
