name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: ghcr.io/lebedenko/holonight-settings-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout holonight-config
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: 81b01d3ae8433f3a4b017db2feb588a1ee62b714
          path: holonight-config-dep
      - name: Checkout holonight-qt
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: 6f591cbdfb8c8e887e87e43a1c4e0c48c1f5f39d
          path: holonight-qt-dep
      - name: Checkout holonight-shell
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-shell
          ref: 93e1faf3659d1aac0a506d173ac58839fe3b05b5
          path: holonight-shell-dep
      - name: Install holonight-config
        run: |
          cmake -S holonight-config-dep -B holonight-config-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build holonight-config-dep/build --parallel
          cmake --install holonight-config-dep/build --prefix /usr
      - name: Install holonight-qt
        run: |
          cmake -S holonight-qt-dep -B holonight-qt-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build holonight-qt-dep/build --parallel
          cmake --install holonight-qt-dep/build --prefix /usr
      - name: Install holonight-shell config
        run: |
          cmake -S holonight-shell-dep/libs/holonight-shell-config -B holonight-shell-config-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build holonight-shell-config-build --parallel
          cmake --install holonight-shell-config-build --prefix /usr
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: dbus-run-session -- ctest --test-dir build --output-on-failure --no-tests=error
      - name: QML checks
        run: |
          bash scripts/check-qmltypes.sh build
          cmake --build build --target qml-lint
      - name: Application install smoke
        run: |
          cmake --install build --prefix /tmp/holonight-settings-prefix
          test -x /tmp/holonight-settings-prefix/bin/holonight-settings

  static-checks:
    runs-on: ubuntu-24.04
    container: ghcr.io/lebedenko/holonight-settings-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout holonight-config
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: 81b01d3ae8433f3a4b017db2feb588a1ee62b714
          path: holonight-config-dep
      - name: Checkout holonight-qt
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-qt
          ref: 6f591cbdfb8c8e887e87e43a1c4e0c48c1f5f39d
          path: holonight-qt-dep
      - name: Checkout holonight-shell
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-shell
          ref: 93e1faf3659d1aac0a506d173ac58839fe3b05b5
          path: holonight-shell-dep
      - name: Install holonight-config
        run: |
          cmake -S holonight-config-dep -B holonight-config-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build holonight-config-dep/build --parallel
          cmake --install holonight-config-dep/build --prefix /usr
      - name: Install holonight-qt
        run: |
          cmake -S holonight-qt-dep -B holonight-qt-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build holonight-qt-dep/build --parallel
          cmake --install holonight-qt-dep/build --prefix /usr
      - name: Install holonight-shell config
        run: |
          cmake -S holonight-shell-dep/libs/holonight-shell-config -B holonight-shell-config-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build holonight-shell-config-build --parallel
          cmake --install holonight-shell-config-build --prefix /usr
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON
      - run: cmake --build build --target format-check
      - run: cmake --build build --target tidy
