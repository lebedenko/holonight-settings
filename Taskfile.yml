version: '3'
vars:
  PRESET: '{{default "dev" .PRESET}}'
  BUILD_DIR: build/{{.PRESET}}
  RELEASE_BUILD_DIR: build/release
tasks:
  license-check:
    desc: Validate REUSE licensing metadata
    cmds:
    - reuse lint
  install:
    desc: Build and install to ~/.local
    deps:
    - build
    cmds:
    - cmake --install {{.BUILD_DIR}}
  install:system:
    desc: Build and install the release build to /usr (requires sudo)
    deps:
    - build:release
    cmds:
    - sudo cmake --install {{.RELEASE_BUILD_DIR}}
  uninstall:
    desc: Uninstall the debug build from ~/.local
    cmds:
    - "test -f \"{{.BUILD_DIR}}/install_manifest.txt\"\nwhile IFS= read -r installed_file; do\n  rm -f -- \"$installed_file\"\
      \ndone < \"{{.BUILD_DIR}}/install_manifest.txt\"\n"
  uninstall:system:
    desc: Uninstall the release build from /usr (requires sudo)
    cmds:
    - 'test -f "{{.RELEASE_BUILD_DIR}}/install_manifest.txt"

      sudo xargs -r -d ''\n'' rm -f -- < "{{.RELEASE_BUILD_DIR}}/install_manifest.txt"

      '
  run:
    desc: Build and run the Settings application
    deps:
    - build
    cmds:
    - ./{{.BUILD_DIR}}/apps/settings/holonight-settings
  qml-lint:
    desc: qml-lint
    cmds:
    - cmake --build build/{{.PRESET}} --target qml-lint
  qml-import-check:
    desc: Check application runtime Controls policy and fixtures
    cmds:
    - python3 scripts/check-qml-import-policy.py
    - python3 tests/test_qml_import_policy.py
  qmltypes-check:
    desc: Check generated QML type metadata
    deps:
    - build
    cmds:
    - bash scripts/check-qmltypes.sh build/{{.PRESET}}
  coverage:
    desc: Build coverage report
    cmds:
    - cmake --preset dev -B build/coverage -DENABLE_COVERAGE=ON
    - cmake --build build/coverage --target coverage
  clean:
    desc: Remove the build directory
    prompt: Remove {{.BUILD_DIR}}/ entirely?
    cmds:
    - rm -rf {{.BUILD_DIR}}
  check:
    desc: Authoritative container acceptance
    cmds:
    - python3 scripts/ci/container.py check {{.CLI_ARGS}}
  configure:
    desc: configure
    cmds:
    - cmake --preset {{.PRESET}} {{.CLI_ARGS}}
  build:
    desc: build
    cmds:
    - cmake --preset {{.PRESET}}
    - cmake --build --preset {{.PRESET}}
  test:
    desc: test
    cmds:
    - task: build
      vars:
        PRESET: dev
    - dbus-run-session -- ctest --preset dev {{.CLI_ARGS}}
  configure:release:
    desc: configure:release
    cmds:
    - cmake --preset release {{.CLI_ARGS}}
  build:release:
    desc: build:release
    cmds:
    - cmake --preset release
    - cmake --build --preset release
  format:
    desc: Format with the pinned container tools
    cmds:
    - python3 scripts/ci/container.py format
  format-check:
    desc: format-check
    cmds:
    - python3 scripts/quality.py format-check
  tidy:
    desc: tidy
    cmds:
    - python3 scripts/quality.py tidy --build build/{{.PRESET}}
  check:integration:
    desc: Container acceptance plus Release staging and runtime checks
    cmds:
    - python3 scripts/ci/container.py integration {{.CLI_ARGS}}
